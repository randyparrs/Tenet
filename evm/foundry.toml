[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200

remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
  "escrow/=src/",
]

# Demo mode (README.md, "The Demo Shop runs on minutes"): the same tests against evm/demo/RefundEscrow.sol, built by
# tools/make_demo_escrow.py. Separate output folder, so evm/out stays the live build.
[profile.demo]
src = "demo"
out = "out-demo"
cache_path = "cache-demo"
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
  "escrow/=demo/",
]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 60
fail_on_revert = false
