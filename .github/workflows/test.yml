name: Tests

# Runs on every push and pull request. No keys and no transactions: the escrow on a local chain
# (anvil), the judges in Lacre's simulated GenVM SDK, and the Circle API simulated.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  escrow:
    name: Escrow (live and demo builds)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Live build, 42 tests
        working-directory: evm
        run: forge test
      - name: Demo build, the same 42 tests
        working-directory: evm
        run: FOUNDRY_PROFILE=demo forge test

  judges-and-rehearsals:
    name: Judges and rehearsals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LACRE_DIR: ${{ github.workspace }}/../lacre
      # The commit of Lacre whose simulated SDK and verifier the tests use (see NOTICE.md)
      LACRE_COMMIT: d2cb1fc1b19b9b31af7ef1b561221f447ec21838
      VENV_PY: python
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install
        run: |
          python -m pip install genlayer-py==0.16.3 web3==8.0.0 eth-account==0.14.0 requests==2.34.2 truststore==0.10.4
          git clone --quiet https://github.com/eudomar500/lacre "$LACRE_DIR"
          git -C "$LACRE_DIR" checkout --quiet "$LACRE_COMMIT"
          npm ci --prefix worker
      - name: Build both escrows (the rehearsals deploy them on anvil)
        working-directory: evm
        run: forge build && FOUNDRY_PROFILE=demo forge build
      - name: Claim flow and email date rules
        run: |
          python tests/test_claim_flow.py
          python tests/test_resolve_date.py
      - name: Both judge contracts, as built, in the simulated GenVM SDK
        run: python tools/lacre_boot.py tests/judge_v2_stub_run.py
      - name: Live test rehearsal (cases A to E on anvil)
        run: python tools/lacre_boot.py tests/e2e_rehearsal.py
      - name: Circle routes of the Worker
        run: node worker/test/circle.test.mjs
      - name: Demo Shop rehearsal (Worker, page and wallets on anvil)
        run: node worker/test/rehearsal.mjs
